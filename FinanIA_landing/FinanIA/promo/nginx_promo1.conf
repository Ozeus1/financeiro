server {
    listen 80;
    server_name promo1.finania.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name promo1.finania.pro;

    # Certificados SSL — preenchidos pelo certbot
    # ssl_certificate /etc/letsencrypt/live/promo1.finania.pro/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/promo1.finania.pro/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/promo1;
    index Promo.html;

    location / {
        try_files $uri $uri/ /Promo.html;
    }

    location ~* \.(png|svg|jpg|jpeg|css|js|jsx|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/xml application/xml image/svg+xml;
}
