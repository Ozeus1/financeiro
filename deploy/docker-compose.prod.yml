version: '3.8'

services:
  finan_web:
    build:
      context: ../flask
      dockerfile: Dockerfile
    container_name: finan_web
    restart: always
    env_file:
      - ../flask/.env.production
    networks:
      - finan_internal
    depends_on:
      finan_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"   # expõe apenas para localhost (Nginx faz proxy)
    volumes:
      - finan_uploads:/app/static/uploads
      - finan_instance:/app/instance

  finan_db:
    image: postgres:15-alpine
    container_name: finan_db
    restart: always
    env_file:
      - ../flask/.env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - finan_db_data:/var/lib/postgresql/data
    networks:
      - finan_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  finan_internal:
    driver: bridge

volumes:
  finan_db_data:
  finan_uploads:
  finan_instance:
