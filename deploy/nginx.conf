# Nginx config: finan_pub
# Domínio: www.finan.automathos.cloud
# Após instalar o SSL com certbot, ele irá editar este arquivo automaticamente.

server {
    listen 80;
    server_name finan.automathos.cloud www.finan.automathos.cloud;

    # Redireciona HTTP → HTTPS (certbot adiciona o bloco 443 abaixo)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name finan.automathos.cloud www.finan.automathos.cloud;

    # Certificados SSL — serão preenchidos pelo certbot
    # ssl_certificate /etc/letsencrypt/live/finan.automathos.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/finan.automathos.cloud/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    # Arquivos estáticos servidos diretamente pelo Nginx
    location /static/ {
        alias /home/deploy/finan_pub/flask/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Todo o resto vai para o Gunicorn (Flask)
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
